name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true

      - run: pnpm install --frozen-lockfile

      - name: Secretlint
        run: pnpm run scan:secretlint

      - name: Gitleaks
        run: pnpm run scan:gitleaks

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format

      - name: Typecheck
        run: pnpm run typecheck

      - name: Knip
        run: pnpm run knip

      - name: Dependency cruiser
        run: pnpm run depcruise

      - name: Markdownlint
        run: pnpm run lint:md

      - name: Actionlint
        run: pnpm run lint:actions

      - name: ShellCheck
        run: pnpm run lint:sh

      - name: Shfmt
        run: pnpm run format:sh

      - name: Test
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build
