name: CI

on: push

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
        with:
          install: true

      - run: npm ci

      - name: Secretlint
        run: npm run scan:secretlint

      - name: Gitleaks
        run: npm run scan:gitleaks

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Knip
        run: npm run knip

      - name: Dependency cruiser
        run: npm run depcruise

      - name: Markdownlint
        run: npm run lint:md

      - name: Actionlint
        run: npm run lint:actions

      - name: ShellCheck
        run: npm run lint:sh

      - name: Shfmt
        run: npm run format:sh

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
